name: CI

# Runs on Windows as well as macOS/Linux on purpose: the plugin ships Windows
# support but is developed on a Mac, so platform bugs (path separators, the
# slugified transcript paths, anything assuming POSIX) are otherwise invisible
# until a Windows user hits them.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 20 is what Stream Deck's bundled runtime provides (manifest
          # Nodejs.Version), so that is the version that actually matters.
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Lint
        # Correctness rules only, no formatting. Runs before the build so a dead
        # reference fails here with a file and line rather than as a runtime
        # ReferenceError inside Stream Deck, where nothing surfaces it.
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build the bundle
        run: npm run build

      - name: Committed bundle is in sync with src
        # Stream Deck loads bin/plugin.mjs, not src/, so a stale committed bundle
        # ships old behaviour while the source looks correct. Rebuilding above and
        # then finding a diff means someone changed src without rebuilding.
        run: git diff --exit-code -- dev.tapparello.claude-deck.sdPlugin/bin/plugin.mjs

      - name: Selftest (loads and runs the real bundle)
        # The closest thing to running the plugin without a Stream Deck: it boots
        # the bundle under this OS's Node and exercises every poller. On a bare
        # runner there is no ~/.claude, so this also proves the "no data
        # anywhere" paths degrade instead of throwing.
        run: npm run selftest

      - name: Manifest and Property Inspector are valid
        run: |
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('dev.tapparello.claude-deck.sdPlugin/manifest.json', 'utf8'));
            if (!/^\d+\.\d+\.\d+\.\d+$/.test(m.Version)) throw new Error('Version must be 4-part: ' + m.Version);
            // The manifest is the source of truth (Stream Deck demands 4 parts), but
            // package.json drifted to 1.0.0 while the plugin shipped 1.8.0.0. Require
            // the manifest to extend the package version, leaving the 4th part free
            // to act as a build number.
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (!m.Version.startsWith(pkg.version + '.')) {
              throw new Error('manifest Version ' + m.Version + ' does not extend package.json version ' + pkg.version);
            }
            const uuids = m.Actions.map(a => a.UUID);
            if (new Set(uuids).size !== uuids.length) throw new Error('duplicate action UUID');
            const dir = 'dev.tapparello.claude-deck.sdPlugin/';
            // The plugin icon is the one surface Elgato requires as PNG (256, plus a
            // 512 @2x). It must ALSO not exist as an .svg: manifest icon paths carry
            // no extension, so shipping both makes the choice a coin toss.
            if (!fs.existsSync(dir + m.Icon + '.png')) throw new Error('plugin Icon must exist as PNG: ' + m.Icon);
            if (!fs.existsSync(dir + m.Icon + '@2x.png')) throw new Error('plugin Icon needs a @2x PNG: ' + m.Icon);
            if (fs.existsSync(dir + m.Icon + '.svg')) throw new Error('plugin Icon exists as both .svg and .png: ' + m.Icon);
            if (!fs.existsSync(dir + m.CategoryIcon + '.svg')) throw new Error('missing CategoryIcon: ' + m.CategoryIcon);
            // Action-list icons must be monochrome white on transparent — no fills,
            // no background plate. That is a marketplace requirement, and it is the
            // opposite of what the KEY art does, so the two sets cannot be shared.
            const listIcons = [m.CategoryIcon, ...m.Actions.map(a => a.Icon)];
            for (const icon of listIcons) {
              const svg = fs.readFileSync(dir + icon + '.svg', 'utf8');
              const fills = (svg.match(/fill="(?!none)[^"]+"/g) || []);
              if (fills.length) throw new Error(icon + ' has a fill (list icons must be stroke-only): ' + fills[0]);
              for (const stroke of svg.match(/stroke="[^"]+"/g) || []) {
                if (stroke !== 'stroke="#FFFFFF"') throw new Error(icon + ' is not monochrome white: ' + stroke);
              }
            }
            for (const a of m.Actions) {
              if (!a.UUID.startsWith(m.UUID + '.')) throw new Error('action outside the plugin namespace: ' + a.UUID);
              for (const icon of [a.Icon, ...(a.States || []).map(s => s.Image)]) {
                if (icon && !fs.existsSync(dir + icon + '.svg')) {
                  throw new Error('missing icon: ' + icon);
                }
              }
              if (a.PropertyInspectorPath && !fs.existsSync('dev.tapparello.claude-deck.sdPlugin/' + a.PropertyInspectorPath)) {
                throw new Error('missing PI: ' + a.PropertyInspectorPath);
              }
            }
            const pi = fs.readFileSync('dev.tapparello.claude-deck.sdPlugin/pi/pi.html', 'utf8');
            new Function(pi.split('<script>')[1].split('</script>')[0]);
            console.log('manifest OK: v' + m.Version + ', ' + m.Actions.length + ' actions, PI parses');
          "
