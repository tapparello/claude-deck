name: CI

# Runs on Windows as well as macOS/Linux on purpose: the plugin ships Windows
# support but is developed on a Mac, so platform bugs (path separators, the
# slugified transcript paths, anything assuming POSIX) are otherwise invisible
# until a Windows user hits them.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 20 is what Stream Deck's bundled runtime provides (manifest
          # Nodejs.Version), so that is the version that actually matters.
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Lint
        # Correctness rules only, no formatting. Runs before the build so a dead
        # reference fails here with a file and line rather than as a runtime
        # ReferenceError inside Stream Deck, where nothing surfaces it.
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build the bundle
        run: npm run build

      - name: Committed bundle is in sync with src
        # Stream Deck loads bin/plugin.mjs, not src/, so a stale committed bundle
        # ships old behaviour while the source looks correct. Rebuilding above and
        # then finding a diff means someone changed src without rebuilding.
        run: git diff --exit-code -- dev.tapparello.agent-vitals.sdPlugin/bin/plugin.mjs

      - name: Selftest (loads and runs the real bundle)
        # The closest thing to running the plugin without a Stream Deck: it boots
        # the bundle under this OS's Node and exercises every poller. On a bare
        # runner there is no ~/.claude, so this also proves the "no data
        # anywhere" paths degrade instead of throwing.
        run: npm run selftest

      - name: Package validates against Elgato's own schema
        # A dry-run pack runs Elgato's validator over the manifest — stricter and
        # more current than the hand-rolled checks below, and it is the same code
        # path a Marketplace submission goes through, so a listing cannot be
        # rejected for something CI could have caught. --no-update-check keeps it
        # from fetching schemas mid-build.
        run: npx streamdeck pack dev.tapparello.agent-vitals.sdPlugin --dry-run --no-update-check

      - name: Manifest, icons and Property Inspector are valid
        # A real file, not an inline `node -e`: the icon rules need literal double
        # quotes, which terminate the shell string early and broke on all three
        # runners at once while passing locally.
        run: npm run check:manifest
